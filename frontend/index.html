
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chatbot</title>
    <link rel="stylesheet" href="style.css">
    <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/highlight.js@11.11.1/styles/github-dark.min.css"
>

</head>
<body>
    <div class="chat-container">
        <!-- <header>
            <h2>AI Chat Assistant</h2>
            <p>Ask me anything!</p>
        </header> -->
        
        <header>
            <h2>AI Chat Assistant</h2>
            <p>Ask me anything!</p>
            <button type="button" id="new-chat-btn">New Chat</button>
        </header>


        <div id="chat-box" aria-live="polite">
            <div class="message bot">
                Hi! How can I help you today?
            </div>
        </div>


        
        

<form id="chat-form">
    <div class="input-container">

        <textarea
            id="user-input"
            placeholder="Ask anything..."
            rows="1"
            aria-label="Message"
        ></textarea>

        <!-- Selected attachment preview -->
        <div id="attachment-preview" hidden>
            <span class="file-icon">📄</span>
            <span id="file-name"></span>
            <button
                type="button"
                id="remove-file-btn"
                aria-label="Remove attachment"
                title="Remove attachment"
            >×</button>
        </div>

        <!-- Bottom toolbar -->
        <div class="input-toolbar">
            <input
                type="file"
                id="file-input"
                accept=".pdf,.txt,.docx,.py,.js,.html,.css,.json,.md,.png,.jpg,.jpeg,.webp,.gif"
                hidden
            />

            <button
                type="button"
                id="attach-btn"
                class="attach-btn"
                title="Attach a file"
                aria-label="Attach a file"
            >📎</button>

            <span class="input-hint">Attach a file (optional)</span>

            <button type="submit" id="send-btn">Send</button>
        </div>

    </div>
</form>


        <p id="status" role="status"></p>
    </div>

    <!-- Markdown renderer -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- Sanitize generated HTML for safety -->
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>

    <!-- Code syntax highlighting -->
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.11.1/lib/highlight.min.js"></script>

    <!-- Your chatbot JavaScript — keep this last -->
    <script src="script.js"></script>
</body>
</html>
